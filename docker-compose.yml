# =============================================================================
# Swifty-Proteins — orchestration
#
#   make up  → starts db + backend   (what the jury runs)
#
# The app itself is not built here: it is an Expo managed app, run on a device
# with `npx expo start`. See JURY.md.
# =============================================================================

services:
  db:
    image: postgres:16.14-alpine       # exact patch: `16-alpine` drifts as 16.x moves
    environment:
      POSTGRES_USER: protein
      POSTGRES_PASSWORD: protein
      POSTGRES_DB: protein
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protein"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://protein:protein@db:5432/protein
      PORT: 3000
      # From ./.env, which `make up` generates with a random value. The image runs
      # NODE_ENV=production, so config.js refuses to boot without a real secret.
      JWT_SECRET: ${JWT_SECRET:?not set — run `make up`, which generates one into .env}
    ports:
      - "3000:3000"                     # RN app / device talks to host:3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
